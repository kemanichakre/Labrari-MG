
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-frontend
  namespace: library-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-frontend
  template:
    metadata:
      labels:
        app: library-frontend
    spec:
      containers:
        - name: frontend
          image: labrarimg-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: library-management
spec:
  selector:
    app: library-frontend
  ports:
    - port: 3000
      targetPort: 80
  type: NodePort
